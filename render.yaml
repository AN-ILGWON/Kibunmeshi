services:
  - type: web
    name: kibunmeshi
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kibunmeshi-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: kibunmeshi-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: kibunmeshi-db
          property: password
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "false"
      - key: UNSPLASH_ACCESS_KEY
        sync: false

databases:
  - name: kibunmeshi-db
    databaseName: kibunmeshi_db
    user: kibunmeshi_db_user
    plan: free
