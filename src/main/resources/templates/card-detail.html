<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${card.food.name} + ' - カード詳細'">カード詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" th:href="@{/}">
            <img th:src="@{/images/Kibunmeshi_logo.png}" alt="きぶんめし" class="logo-image">
        </a>
        
        <!-- 感情・食べ物バナー -->
        <div class="emotion-food-banner">
            <div class="emotion-food-card happy">
                <span class="emotion-food-text">嬉しい時にも</span>
            </div>
            <div class="emotion-food-card sad">
                <span class="emotion-food-text">悲しい時にも</span>
            </div>
            <div class="emotion-food-card angry">
                <span class="emotion-food-text">怒った時にも</span>
            </div>
            <div class="emotion-food-card tired">
                <span class="emotion-food-text">疲れた時にも</span>
            </div>
        </div>
        
        <nav class="site-nav">
            <a th:href="@{/}" class="nav-link">🏠 トップ</a>
            <a th:href="@{/mypage}" sec:authorize="isAuthenticated()" class="nav-link">📔 マイページ</a>
        </nav>
    </header>

    <main class="site-main" style="max-width: 650px; margin: 0 auto; padding: 20px 16px;">
        <a th:href="@{/mypage}" class="back-link" style="display: inline-block; margin-bottom: 20px; text-decoration: none; font-weight: 700; color: var(--color-primary);">← マイページ / カード一覧に戻る</a>

        <!-- Pokemon TCG Style Card Container -->
        <article class="pokemon-tcg-card">
            <!-- TCG Header -->
            <div class="tcg-header">
                <div class="tcg-title-group">
                    <span class="tcg-stage">カード</span>
                    <h1 class="tcg-name" th:text="${card.food.name}">サムゲタン</h1>
                </div>
                <div class="tcg-hp-group">
                    <span class="tcg-hp-label">HP</span>
                    <span class="tcg-hp-value" th:text="${card.id != null ? (card.id % 150 + 50) : 200}">200</span>
                    <span class="tcg-type-icon" th:text="${card.category != null ? card.category.icon : '🍱'}">🥘</span>
                </div>
            </div>

            <!-- TCG Main Image Frame -->
            <div class="tcg-image-frame">
                <img class="tcg-image"
                     th:src="${card.food.unsplashImageUrl}"
                     th:alt="${card.food.name}"
                     onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600';">
                <span class="tcg-rarity-badge" th:text="${card.isFavorite} ? 'UR ✦ EX' : (${card.isPublic} ? 'SSR ✦ EX' : 'SR ✦')">SSR ✦ EX</span>
            </div>

            <!-- TCG Moves / Stats Box -->
            <div class="tcg-moves-box">
                <!-- Move 1: Description -->
                <div class="tcg-move-item" th:if="${card.food.description}">
                    <div class="tcg-move-header">
                        <span class="tcg-move-tag">
                            <span th:text="${card.emotion != null ? card.emotion.emoji : '😊'}">😊</span>
                            <span>料理の特色</span>
                        </span>
                        <span class="tcg-move-damage">80+</span>
                    </div>
                    <p class="tcg-move-desc" th:text="${card.food.description}">体を温める滋養強壮スープ。</p>
                </div>

                <!-- Move 2: Effect -->
                <div class="tcg-move-item" th:if="${card.food.effect}">
                    <div class="tcg-move-header">
                        <span class="tcg-move-tag">
                            <span>⚡</span>
                            <span>栄養成分・効果</span>
                        </span>
                        <span class="tcg-move-damage">150</span>
                    </div>
                    <p class="tcg-move-desc" th:text="${card.food.effect}">高麗人参のサポニン成分が疲労回復を助けます。</p>
                </div>

                <!-- Chef's Advice -->
                <div class="tcg-move-item" th:if="${card.adviceText}">
                    <div class="tcg-move-header">
                        <span class="tcg-move-tag" style="background: #fef3c7; color: #92400e; border-color: #f59e0b;">
                            <span>💬</span>
                            <span>メッセージ</span>
                        </span>
                    </div>
                    <p class="tcg-move-desc" style="font-style: italic; color: #b45309;" th:text="${card.adviceText}">お祝いの気持ちを込めて。</p>
                </div>
            </div>

            <!-- TCG Card Footer -->
            <div class="tcg-footer">
                <div class="tcg-footer-left">
                    <span th:text="${card.emotion != null ? '気分: ' + card.emotion.label : '気分'}">うれしい</span>
                    <span>•</span>
                    <span th:text="${card.category != null ? 'ジャンル: ' + card.category.label : 'ジャンル'}">韓国料理</span>
                </div>
                <div th:text="${#temporals.format(card.createdAt, 'yyyy.MM.dd')}">2026.01.01</div>
            </div>
        </article>

        <!-- Actions Bar -->
        <div class="action-buttons">
            <!-- Owner Actions -->
            <th:block th:if="${isOwner}">
                <form th:action="@{/mypage/favorite}" method="post" style="display: inline;">
                    <input type="hidden" name="historyId" th:value="${card.id}">
                    <input type="hidden" name="redirect" th:value="@{/card-detail(historyId=${card.id})}">
                    <button type="submit" class="btn btn-secondary" th:text="${card.isFavorite} ? '⭐ お気に入り解除' : '☆ お気に入り追加'">
                        ⭐ お気に入り追加
                    </button>
                </form>
                
                <form th:action="@{/mypage/public}" method="post" style="display: inline;">
                    <input type="hidden" name="historyId" th:value="${card.id}">
                    <input type="hidden" name="isPublic" th:value="${!card.isPublic}">
                    <input type="hidden" name="redirect" th:value="@{/card-detail(historyId=${card.id})}">
                    <button type="submit" class="btn btn-secondary" th:text="${card.isPublic} ? '🔒 非公開にする' : '🌍 公開する'">
                        🌍 公開する
                    </button>
                </form>
                
                <form th:action="@{/mypage/delete}" method="post" style="display: inline;" onsubmit="return confirm('このカードを削除しますか？');">
                    <input type="hidden" name="historyId" th:value="${card.id}">
                    <input type="hidden" name="redirect" value="/mypage">
                    <button type="submit" class="btn btn-danger">🗑️ 削除</button>
                </form>
            </th:block>

            <!-- Non-Owner (Public Card Collector Actions) -->
            <th:block th:if="${!isOwner}">
                <form th:action="@{/mypage/collect}" method="post" style="display: inline;">
                    <input type="hidden" name="historyId" th:value="${card.id}">
                    <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none;">
                        ⭐ コレクションに追加 (マイページへ保存)
                    </button>
                </form>
            </th:block>

            <a th:href="@{/mypage}" class="btn btn-secondary">📔 マイページ</a>
            <a th:href="@{/}" class="btn btn-secondary">🏠 トップ</a>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 きぶんめし (Kibunmeshi) - 今日の気分にぴったりのごはんを</p>
    </footer>
</body>
</html>
