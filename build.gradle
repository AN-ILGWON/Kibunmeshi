plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.kibunmeshi'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starter
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// Spring Security (簡易認証用)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	
	// MyBatis
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	
	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql:42.7.3'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Google Gemini API
	implementation 'com.google.genai:google-genai:0.1.0'
	
	// テスト
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources) {
	filteringCharset = 'UTF-8'
}

tasks.withType(JavaExec) {
	systemProperty 'file.encoding', 'UTF-8'
}

bootRun {
	systemProperty 'file.encoding', 'UTF-8'
}

tasks.register('migrateEffectRarity', JavaExec) {
	group = 'database'
	description = 'Add effect/rarity columns to foods table'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.kibunmeshi.tools.MigrateEffectRarity'
}

tasks.register('reloadData', JavaExec) {
	group = 'database'
	description = 'Reload data.sql into foods table'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.kibunmeshi.tools.ReloadData'
}

tasks.register('migrateUsers', JavaExec) {
	group = 'database'
	description = 'Migrate users table structure (password -> password_hash, add role/enabled)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.kibunmeshi.tools.MigrateUsers'
}
